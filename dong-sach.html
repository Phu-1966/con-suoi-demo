<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf0ed">
<title>Dòng Sách — Khu Vườn Tâm Thức</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9efeb;color:#29443e;font-family:Georgia,"Times New Roman",serif}
.intro{padding:34px 22px 25px;text-align:center;background:linear-gradient(180deg,#f4f6f1,#e9efeb)}
.eyebrow{margin:0 0 9px;font:12px/1.5 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#6e8980}
h1{margin:0;font-size:clamp(34px,8vw,54px);font-weight:400;letter-spacing:.12em}
.intro p{margin:15px auto 0;max-width:520px;color:#60786f;font-size:17px;line-height:1.65}
.stream{position:relative;width:100%;max-width:1100px;margin:0 auto;overflow:hidden;background:#526d62;isolation:isolate}
.stream img{display:block;width:100%;height: min(105vw,900px);min-height:570px;object-fit:cover;object-position:center;filter:saturate(.86) brightness(.92)}
.stream:after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(18,43,36,.06),rgba(18,43,36,.08) 55%,rgba(18,43,36,.22))}
.pebble{position:absolute;z-index:2;width:clamp(58px,12vw,112px);height:clamp(40px,7.5vw,70px);padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;transform:translate(-50%,-50%);outline:none}
.pebble:hover,.pebble:active,.pebble:focus,.pebble.selected{transform:translate(-50%,-50%);filter:none;box-shadow:none;outline:none}
.pebble-number{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:rgba(255,255,248,.96);text-shadow:0 1px 8px rgba(0,0,0,.6);font:16px/1 system-ui,sans-serif;opacity:0;transition:opacity .5s ease;pointer-events:none}
.pebble.selected .pebble-number{opacity:.94}
.ripple{

  position:absolute;

  z-index:4;

  width:100px;

  height:60px;

  pointer-events:none;

  transform:translate(-50%,-50%) rotate(-9deg);

}

.ripple span{

  position:absolute;

  inset:0;

  border:2.5px solid rgba(220,239,230,.68);

  border-radius:48% 52% 43% 57% / 53% 44% 56% 47%;

  box-shadow:none;

  opacity:0;

  animation:water-wave 3.2s cubic-bezier(.16,.48,.32,1) forwards;

}

.ripple span:nth-child(2){

  border-radius:55% 45% 52% 48% / 44% 56% 46% 54%;

  animation-delay:.4s;

}

.ripple span:nth-child(3){

  border-radius:43% 57% 46% 54% / 56% 45% 55% 44%;

  animation-delay:.8s;

}


@keyframes water-wave{

  0%{

    transform:scale(2, 1.7);

    opacity:0;

  }

  12%{

    opacity:.75;

  }

  65%{

    opacity:.35;

  }

  100%{

    transform:scale(7,4.5);

    opacity:0;

  }

}

.caption{padding:24px 20px 35px;text-align:center;color:#5f786f;font-size:18px;line-height:1.65;background:linear-gradient(180deg,#e9efeb,#f3f5f0)}
.caption small{display:block;margin-top:8px;color:#83978e;font:12px/1.5 system-ui,sans-serif;letter-spacing:.04em}
.book-panel{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(20,38,33,.35);backdrop-filter:blur(5px)}
.book-panel.open{display:flex}.panel-card{position:relative;width:min(100%,420px);padding:36px 25px 28px;text-align:center;border:1px solid rgba(255,255,255,.7);border-radius:22px;background:rgba(248,249,244,.97);box-shadow:0 18px 55px rgba(19,44,35,.18)}
.panel-kicker{margin:0 0 10px;color:#789187;font:11px/1.5 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.panel-card h2{margin:0 0 14px;font-size:29px;font-weight:400;line-height:1.25}.panel-card p{margin:0 auto 24px;max-width:320px;color:#6d8078;font-size:16px;line-height:1.65}
.panel-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.panel-actions button{border:1px solid #c4d3cb;border-radius:999px;padding:11px 18px;background:#f8faf6;color:#39584e;font:14px system-ui,sans-serif;cursor:pointer}.panel-actions .primary{background:#dce9e1}
.close{position:absolute;right:13px;top:12px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:#597168;font-size:25px;cursor:pointer}
@media(min-width:800px){.stream img{height:760px}}@media(prefers-reduced-motion:reduce){.pebble-number{transition:none}.ripple span{animation-duration:1ms}}
</style>
</head>
<body>
<header class="intro"><p class="eyebrow">Khu Vườn Tâm Thức</p><h1>DÒNG SÁCH</h1><p>Chạm vào một viên đá, mặt nước lại kể một câu chuyện.</p></header>
<main>
<section class="stream" id="stream" aria-label="Dòng suối và mười điểm chạm đọc sách">
<img src="da-cuoi.jpg" alt="Những viên đá tự nhiên nằm trong dòng suối">
<button class="pebble" style="left:10%;top:17%" data-book="Ếch con ngây thơ" aria-label="Mở sách 1"><span class="pebble-number">1</span></button>
<button class="pebble" style="left:31%;top:13%" data-book="Con Cò" aria-label="Mở sách 2"><span class="pebble-number">2</span></button>
<button class="pebble" style="left:54%;top:19%" data-book="Dòng sông không bờ" aria-label="Mở sách 3"><span class="pebble-number">3</span></button>
<button class="pebble" style="left:80%;top:14%" data-book="Cái Ao làng" aria-label="Mở sách 4"><span class="pebble-number">4</span></button>
<button class="pebble" style="left:18%;top:37%" data-book="Khu vườn trước sân" aria-label="Mở sách 5"><span class="pebble-number">5</span></button>
<button class="pebble" style="left:42%;top:43%" data-book="Căn nhà mái lá" aria-label="Mở sách 6"><span class="pebble-number">6</span></button>
<button class="pebble" style="left:69%;top:39%" data-book="Dòng chảy vô tận" aria-label="Mở sách 7"><span class="pebble-number">7</span></button>
<button class="pebble" style="left:88%;top:50%" data-book="Về nơi rỗng rang" aria-label="Mở sách 8"><span class="pebble-number">8</span></button>
<button class="pebble" style="left:31%;top:68%" data-book="Dòng chảy tự nhiên" aria-label="Mở sách 9"><span class="pebble-number">9</span></button>
<button class="pebble" style="left:64%;top:76%" data-book="Năm cánh hoa" aria-label="Mở sách 10"><span class="pebble-number">10</span></button>
</section>
<div class="caption">Những cuốn sách nằm yên bên dòng nước.<small>Chạm nhẹ vào một điểm đá để khám phá.</small></div>
</main>
<div class="book-panel" id="bookPanel" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><div class="panel-card">
<button class="close" id="closePanel" aria-label="Đóng">×</button><p class="panel-kicker">Một viên đá đã kể chuyện</p><h2 id="panelTitle"></h2><p id="panelText">Cuốn sách đang chờ được nối vào dòng suối.</p>
<div class="panel-actions"><button id="readBook" class="primary">Mở sách</button><button id="backToStream">Trở lại dòng suối</button></div>
</div></div>
<script>
(()=>{const stream=document.getElementById('stream'),panel=document.getElementById('bookPanel'),title=document.getElementById('panelTitle'),read=document.getElementById('readBook');
function closePanel(){panel.classList.remove('open')}
document.getElementById('closePanel').addEventListener('click',closePanel);document.getElementById('backToStream').addEventListener('click',closePanel);
panel.addEventListener('click',e=>{if(e.target===panel)closePanel()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
stream.querySelectorAll('.pebble').forEach(pebble=>pebble.addEventListener('click',event=>{
stream.querySelectorAll('.pebble').forEach(p=>p.classList.remove('selected'));pebble.classList.add('selected');
const rect=stream.getBoundingClientRect(),ripple=document.createElement('div');ripple.className='ripple';ripple.style.left=(event.clientX-rect.left)+'px';ripple.style.top=(event.clientY-rect.top)+'px';
for(let i=0;i<3;i++)ripple.appendChild(document.createElement('span'));stream.appendChild(ripple);setTimeout(()=>ripple.remove(),2300);
title.textContent=pebble.dataset.book;document.getElementById('panelText').textContent='Tên sách đã được chọn. Ta sẽ nối tệp EPUB thật ở bước tiếp theo.';
const epubFiles = {

  "Ếch con ngây thơ": "Ech_con_ngay_tho_.epub",

  "Con Cò": "Con_co.epub"

};

read.onclick = () => {

  const file = epubFiles[pebble.dataset.book];

  if (file) {

    window.location.href = file;

  } else {

    document.getElementById('panelText').textContent =

      'Cuốn sách này chưa có tệp EPUB.';

  }

};
setTimeout(()=>panel.classList.add('open'),650);
}));})();
</script>
</body></html>
